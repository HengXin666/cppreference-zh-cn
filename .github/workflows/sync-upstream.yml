name: sync-upstream

# 定时把上游 myfreeer/cppreference2mshelp 的中文 html-book 同步进本仓库。
#
# 这里刻意不把 Actions 写成"通知/开 PR"流程: 上游每次发布是一个 8~9MB 的整包,
# 内容近乎全量重写 (实测 2025.04 -> 2026.05: 6734 个文件里 6653 个内容变化),
# 逐文件 diff 没有审阅价值, 所以直接以"整包替换"的形式提交与发布。
#
# 幂等闸门: .github/sync-state.json 里存上游资产的 sha256。身份未变 -> 秒退, 不写任何文件。
# 因此定时跑不会产生空提交, 也不需要在仓库里堆积镜像副本。

on:
  schedule:
    # 上游历史上是一年 1~3 次发布 (2024.09 / 2025.04 / 2026.05), 日检足够。
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略版本身份, 强制重新同步一次'
        type: boolean
        default: false

# 同一时刻只允许一个同步在跑; 不打断进行中的任务 (避免推到一半被取消)。
concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # 只在主仓库跑, 避免 fork 里跑到 push 步骤才失败。
    if: github.repository == 'HengXin666/cppreference-zh-cn'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync upstream html-book
        id: sync
        env:
          # gh CLI 靠它调 GitHub API 读上游 release; 公开仓库只读即可。
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: bash .github/scripts/sync-upstream.sh

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        env:
          TAG: ${{ steps.sync.outputs.tag }}
          ASSET: ${{ steps.sync.outputs.asset }}
        run: |
          set -euo pipefail

          # 沿用本仓库既有的提交信息风格 ([fix] / [sync] 前缀 + 中文说明)。
          # 署名与仓库现有历史保持一致, 便于 git log 阅读。
          git config user.name  'Heng_Xin'
          git config user.email '103022267+HengXin666@users.noreply.github.com'

          revision="$(
            python3 -c 'import json;print(json.load(open(".github/sync-state.json"))["content_revision"])'
          )"
          # 只提交镜像内容与版本身份, 不把工作区里其它改动 (如个人编辑的 README) 卷进来。
          git add -A -- zh common .github/sync-state.json
          git commit -m "[sync] 同步上游中文镜像 ${revision}" \
                     -m "上游: ${ASSET} (release ${TAG})"
          # 显式推到默认分支: schedule 恒在默认分支触发, 手动触发时也不会误推到别的分支。
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "pushed $(git rev-parse --short HEAD) -> ${{ github.event.repository.default_branch }}"

      - name: Nothing to do
        if: steps.sync.outputs.changed != 'true'
        run: echo "上游内容未变化, 本次无需提交。"
